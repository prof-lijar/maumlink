name: Checks and browser suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install project dependencies
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
      - name: Lint, validate content, unit tests and production build
        run: |
          pnpm lint
          pnpm validate
          pnpm test
          pnpm build
      - name: Install Chrome for the browser suite
        run: pnpm exec playwright install --with-deps chrome
      - name: Browser suite against the production build (tests/behavior)
        run: pnpm test:e2e
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: behavior-suite
          path: |
            playwright-report/
            .tmp/behavior-test-results/
          retention-days: 14
